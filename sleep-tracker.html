<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Tracker | HealthPulse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="sleep-tracker">
  <div class="particles" id="particles" aria-hidden="true"></div>
  <nav class="sidebar" id="sidebar" data-active="sleep-tracker"></nav>
  <main class="main-content">
    <header class="top-bar glass">
      <div class="top-bar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">☰</button>
        <h1 class="page-title">Sleep Tracker</h1>
        <p class="page-subtitle">Monitor sleep duration and quality</p>
      </div>
      <div class="top-bar-right">
        <div class="theme-quick" id="themeQuick"></div>
      </div>
    </header>
    <section class="section reveal"><div class="card glass"><form id="sleepForm" class="inline-form">
      <input type="number" id="sleepInput" placeholder="Hours" min="0" max="24" step="0.5" required>
      <button type="submit" class="btn btn-primary">Log Sleep</button></form>
      <p>Average: <strong id="sleepAvgDisplay">--</strong> hours</p></div><div id="sleepHistory" class="list-grid"></div></section>
  </main>
  <div class="toast-container" id="toastContainer"></div>
  <script src="js/storage.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/bmi.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
